webform_senhaunica.callback:
  path: '/callback'
  defaults:
    _title: 'Callback'
    _controller: '\Drupal\webform_senhaunica\Controller\WebformSenhaunicaController'
  requirements:
    _permission: 'access content'


webform_senhaunica.settings:
  path: '/admin/config/webform_senhaunica/settings'
  defaults:
    _title: 'Senha Única Settings'
    _form: 'Drupal\webform_senhaunica\Form\SettingsForm'
  requirements:
    _permission: 'administer site configuration'


webform_senhaunica.logout:
  path: '/senhaunica/logout'
  defaults:
    _controller: '\Drupal\webform_senhaunica\Controller\WebformSenhaunicaController::logout'
    _title: 'Sair'
  requirements:
    _access: 'TRUE'


webform_senhaunica.login:
  path: '/senhaunica/login'
  defaults:
    _controller: '\Drupal\webform_senhaunica\Controller\WebformSenhaunicaController::login'
    _title: 'Login Senha Única'
  requirements:
    _access: 'TRUE'